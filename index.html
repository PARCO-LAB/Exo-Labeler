<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EXO · Annotazioni video</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.45 system-ui, sans-serif; background: #11151b; color: #eef2f6; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100%, 1800px); margin: auto; padding: 12px; }
    p { margin: 0; color: #aab5c2; }
    .toolbar, .transport, .visibility { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
    .selection-strip { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 20px; margin-bottom: 10px; }
    .selection-panel { flex: 1 1 440px; padding: 8px 12px; border: 1px solid #354250; border-radius: 8px; background: #1a212a; }
    .selection-panel summary { cursor: pointer; font-weight: 600; }
    .toolbar { margin-top: 10px; }
    .field { display: grid; gap: 4px; min-width: 200px; }
    label { font-size: .85rem; color: #b9c6d3; }
    select, button { color: #eef2f6; background: #242d38; border: 1px solid #465463; border-radius: 7px; padding: 8px 12px; font: inherit; }
    select { min-width: 200px; }
    button { cursor: pointer; }
    button:hover:enabled { background: #354354; }
    button:disabled, select:disabled { opacity: .5; cursor: default; }
    button:focus-visible, select:focus-visible, input:focus-visible, .annotation-handle:focus-visible { outline: 2px solid #64c7f5; outline-offset: 3px; }
    .visibility { margin-left: auto; padding: 10px 0; }
    .visibility label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
    .visibility input { accent-color: #64c7f5; width: 17px; height: 17px; }
    .visibility button { padding: 3px 7px; font-size: .75rem; }
    .videos { display: flex; align-items: flex-start; gap: 10px; overflow-x: auto; padding-bottom: 12px; }
    .camera { display: flex; flex: 0 0 auto; flex-direction: column; width: calc((100% - 20px) / 3); min-width: 280px; height: clamp(340px, 52vh, 620px); min-height: 220px; border: 1px solid #303a46; border-radius: 10px; overflow: hidden; resize: both; background: #1a212a; }
    .videos.one .camera { width: 100%; }
    .videos.two .camera { width: calc((100% - 10px) / 2); }
    .camera[hidden] { display: none; }
    .camera h2 { margin: 0; padding: 3px 8px; font-size: .75rem; font-weight: 600; }
    .picture { position: relative; flex: 1; min-height: 0; background: #050709; overflow: hidden; }
    video, canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
    canvas { display: none; position: absolute; inset: 0; background: #050709; }
    .videos.frozen canvas { display: block; }
    .videos.frozen video { opacity: .01; }
    .videos.seeking .picture::after { content: ''; position: absolute; inset: 0; background: #050709; }
    #bodyVideo, #bodyCanvas { transform: rotate(180deg); }
    .labels-panel { margin: 0 0 10px; padding: 8px 12px; border: 1px solid #354250; border-radius: 8px; background: #1a212a; }
    .labels-panel summary { cursor: pointer; font-weight: 600; }
    #palette { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; }
    .palette-group { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
    .palette-group strong { margin-right: 3px; color: #aab5c2; font-size: .8rem; }
    .label-chip { padding: 4px 8px; border: 1px solid #63788a; border-radius: 5px; background: #293948; font-size: .82rem; }
    #labelTooltip { position: fixed; z-index: 10; max-width: min(360px, calc(100vw - 16px)); padding: 8px 10px; border: 1px solid #9aaab8; border-radius: 6px; background: #eef2f6; color: #17212b; box-shadow: 0 4px 12px #0008; font-size: .8rem; line-height: 1.35; pointer-events: none; }
    #labelTooltip[hidden] { display: none; }
    .timeline { position: relative; z-index: 2; margin-top: 10px; padding: 7px 12px 12px; border: 1px solid #303a46; border-radius: 8px; background: #1a212a; }
    .transport { gap: 4px 8px; margin-bottom: 3px; }
    .transport button { min-height: 24px; padding: 2px 6px; border-radius: 4px; font-size: .78rem; line-height: 1.2; }
    .nav-icon { display: inline-block; font-size: .65rem; vertical-align: 1px; }
    .readout { margin-left: auto; font-size: .78rem; font-variant-numeric: tabular-nums; color: #c7d7e5; }
    .scrub { --track-name-width: 138px; --progress: 0%; --surface: #e8ecef; position: relative; display: grid; grid-template-columns: var(--track-name-width) minmax(0, 1fr); max-height: min(42vh, 360px); overflow-y: auto; background: var(--surface); border: 1px solid #cbd4dd; border-radius: 4px; }
    .ruler-name, .ruler-surface { position: sticky; top: 0; z-index: 5; height: 22px; background: var(--surface); color: #27323c; }
    .ruler-name { grid-column: 1; grid-row: 1; display: flex; align-items: center; justify-content: center; border-right: 1px solid #96a7b5; font-size: .72rem; font-weight: 700; letter-spacing: .08em; }
    .ruler-surface { grid-column: 2; grid-row: 1; }
    #ruler { position: absolute; inset: 0 9px; font-size: .64rem; font-weight: 650; font-variant-numeric: tabular-nums; }
    .tick { position: absolute; bottom: 0; height: 4px; border-left: 1px solid #bac5ce; }
    .tick.major { height: 7px; border-left-color: #111; }
    .tick span { position: absolute; bottom: 7px; left: 3px; white-space: nowrap; }
    #slider { appearance: none; position: absolute; inset: 0; z-index: 2; display: block; width: 100%; height: 22px; margin: 0; opacity: 0; cursor: ew-resize; }
    #slider:disabled { cursor: default; }
    .ruler-surface:focus-within { outline: 3px solid #64c7f5; outline-offset: -3px; }
    #playheadHead { position: absolute; z-index: 3; top: 0; left: var(--progress); width: 14px; height: 11px; transform: translateX(-50%); background: #168ec4; clip-path: polygon(0 0, 100% 0, 100% 65%, 50% 100%, 0 65%); pointer-events: none; }
    #annotationRows { grid-column: 1 / -1; grid-row: 2; min-height: 56px; background: var(--surface); }
    #gridLines { grid-column: 2; grid-row: 2; position: relative; z-index: 1; margin: 0 9px; pointer-events: none; }
    .grid-line { position: absolute; top: 0; bottom: 0; border-left: 1px solid #bac5ce; }
    .grid-line.major { border-left-color: #111; }
    .annotation-row { display: grid; grid-template-columns: var(--track-name-width) minmax(0, 1fr); min-height: 32px; border-bottom: 1px solid #d6dde5; }
    .track-name { display: flex; align-items: center; padding: 3px 8px; overflow: hidden; border: 0; border-right: 1px solid #d6dde5; border-radius: 0; background: none; color: #27323c; font-size: .75rem; text-align: left; white-space: nowrap; text-overflow: ellipsis; }
    .track-name:hover:enabled { background: #d7e0e5; }
    .annotation-track { position: relative; min-height: 31px; margin: 0 9px; }
    .annotation-bar { position: absolute; z-index: 2; height: 24px; min-width: 20px; border: 1px solid #a3d5ed; border-radius: 3px; background: #3d96c3; box-shadow: 0 1px 3px #0009; }
    .annotation-bar[data-level=mid] { background: #cda668; }
    .annotation-bar[data-level=low] { background: #8fc88f; }
    .annotation-bar[data-level=atomic] { background: #86b9d9; }
    .annotation-bar[data-level=aux] { background: #b48ad8; }
    .annotation-bar.pending { background-image: repeating-linear-gradient(45deg, #0000 0 5px, #ffffff55 5px 9px); }
    .annotation-caption { display: block; width: 100%; height: 100%; padding: 1px 12px; overflow: hidden; border: 0; border-radius: 0; background: none; color: #14212b; font-size: .72rem; font-weight: 600; text-align: left; white-space: nowrap; text-overflow: ellipsis; }
    .annotation-caption:hover:enabled { background: #ffffff55; }
    .annotation-handle { position: absolute; z-index: 1; top: 0; bottom: 0; width: 9px; cursor: ew-resize; touch-action: none; }
    .annotation-handle::before { content: ''; position: absolute; top: 0; bottom: 0; width: 3px; background: #edf5f9; pointer-events: none; }
    .annotation-handle.start { left: 0; }
    .annotation-handle.start::before { left: 0; }
    .annotation-handle.end { right: 0; }
    .annotation-handle.end::before { right: 0; }
    .annotation-bar.point { min-width: 12px; width: 12px !important; }
    .annotation-bar.point .annotation-handle { width: 12px; }
    .annotation-bar.point .annotation-handle::before { width: 4px; }
    #playheadLine { grid-column: 2; grid-row: 1 / 3; position: relative; z-index: 4; margin: 0 9px; pointer-events: none; }
    #playheadLine::before { content: ''; position: absolute; top: 11px; bottom: 0; left: var(--progress); border-left: 2px solid #168ec4; transform: translateX(-1px); }
    #status:not(:empty) { margin-top: 7px; }
    #status.warn { color: #f6c975; }
    #status.error { color: #ff9a9a; }
    #seekState { color: #f6c975; font-size: .85rem; }
    dialog { color: #eef2f6; background: #242d38; border: 1px solid #465463; border-radius: 8px; max-width: min(94vw, 540px); max-height: 85vh; overflow-y: auto; }
    dialog::backdrop { background: #0009; }
    dialog p { margin-bottom: 12px; }
    .edit-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .edit-grid [hidden] { display: none; }
    .edit-grid label { display: grid; gap: 3px; }
    .edit-grid input:not([type=checkbox]), .edit-grid select, .edit-grid textarea { width: 100%; min-width: 0; padding: 6px; color: #eef2f6; background: #141c24; border: 1px solid #607080; border-radius: 5px; font: inherit; }
    .edit-grid fieldset { min-width: 0; margin: 0; padding: 8px; border: 1px solid #607080; border-radius: 5px; }
    .edit-grid legend { padding: 0 4px; font-size: .85rem; color: #b9c6d3; }
    #parentChoices { display: grid; gap: 4px; max-height: 160px; overflow-y: auto; }
    #parentChoices label { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 4px; cursor: pointer; }
    #parentChoices label:hover { background: #354354; }
    #parentChoices label:has(input:checked) { background: #284358; outline: 1px solid #64c7f5; }
    #parentChoices input { flex: 0 0 16px; width: 16px; height: 16px; accent-color: #64c7f5; }
    .edit-wide { grid-column: 1 / -1; }
    .dialog-actions { display: flex; gap: 8px; margin-top: 16px; }
    .dialog-actions button:last-child { margin-left: auto; }
    #chooseList { display: grid; gap: 6px; margin: 12px 0; }
    #chooseList button { text-align: left; }
    @media (max-width: 700px) { .visibility { margin-left: 0; width: 100%; padding: 0; } }
  </style>
</head>
<body>
<main>
  <div class="selection-strip">
    <details id="selectionPanel" class="selection-panel">
      <summary id="selectionSummary">Soggetto e sequenza</summary>
      <div class="toolbar">
        <div class="field"><label for="subject">Soggetto</label><select id="subject" disabled></select></div>
        <div class="field"><label for="sequence">Sequenza</label><select id="sequence" disabled></select></div>
      </div>
    </details>
    <div class="visibility" aria-label="Camere visibili">
      <label><input type="checkbox" data-camera="body" checked> Body</label>
      <label><input type="checkbox" data-camera="external" checked> Esterna</label>
      <label><input type="checkbox" data-camera="aria" checked> Aria</label>
      <button id="resetViews" type="button" aria-label="Ripristina le dimensioni dei video" title="Ripristina le dimensioni dei video">↺ Dimensioni</button>
    </div>
  </div>

  <details id="labelsPanel" class="labels-panel"><summary>Label · clicca al frame corrente</summary><div id="palette"></div><div id="labelTooltip" role="tooltip" hidden></div></details>

  <div id="videos" class="videos">
    <section class="camera" data-camera="body"><h2>Body</h2><div class="picture"><video id="bodyVideo" muted playsinline preload="metadata"></video><canvas id="bodyCanvas" aria-hidden="true"></canvas></div></section>
    <section class="camera" data-camera="external"><h2>Esterna</h2><div class="picture"><video id="externalVideo" muted playsinline preload="metadata"></video><canvas id="externalCanvas" aria-hidden="true"></canvas></div></section>
    <section class="camera" data-camera="aria"><h2>Aria</h2><div class="picture"><video id="ariaVideo" muted playsinline preload="metadata"></video><canvas id="ariaCanvas" aria-hidden="true"></canvas></div></section>
  </div>

  <div id="timeline" class="timeline">
    <div class="transport">
      <button id="previous" type="button" disabled aria-label="Frame precedente"><span class="nav-icon" aria-hidden="true">◀</span> Frame</button>
      <button id="play" type="button" disabled><span class="nav-icon" aria-hidden="true">▶</span> <span class="button-label">Riproduci</span></button>
      <button id="next" type="button" disabled aria-label="Frame successivo">Frame <span class="nav-icon" aria-hidden="true">▶</span></button>
      <button id="endLabel" type="button" disabled>End · chiudi intervallo</button>
      <button id="saveLabels" type="button" disabled>Salva</button>
      <button id="help" type="button" aria-label="Aiuto">?</button>
      <span id="readout" class="readout">Frame —</span>
    </div>
    <div id="scrub" class="scrub">
      <div class="ruler-name">FRAME</div>
      <div class="ruler-surface"><div id="ruler" aria-hidden="true"><div id="playheadHead"></div></div><input id="slider" type="range" min="0" max="0" value="0" step="1" disabled aria-label="Posizione in frame"></div>
      <div id="annotationRows" aria-label="Tracce delle annotazioni"></div>
      <div id="gridLines" aria-hidden="true"></div>
      <div id="playheadLine" aria-hidden="true"></div>
    </div>
    <span id="seekState" role="status" aria-live="polite"></span>
    <p id="status" role="status" aria-live="polite">Caricamento catalogo…</p>
  </div>
</main>
<dialog id="helpDialog" aria-label="Aiuto"><p id="helpDetails"></p><p>Frecce ← →: un frame · Barra spaziatrice: riproduci o pausa</p><p>Trascina l'angolo in basso a destra di una finestra per ridimensionarla.</p><button id="closeHelp" type="button">Chiudi</button></dialog>
<dialog id="editDialog" aria-label="Modifica annotazione">
  <form id="editForm">
    <h2 id="editTitle"></h2>
    <div class="edit-grid">
      <label>Frame iniziale<input id="editStart" type="number" min="1" required></label>
      <label>Frame finale<input id="editEnd" type="number" min="1" required></label>
      <label class="for-mid">Ripetizione<input id="editRep" type="number" min="1" step="1"></label>
      <label class="for-side">Lato<select id="editSide"></select></label>
      <label class="for-direction">Direzione<select id="editDirection"></select></label>
      <label class="for-load">Carico esterno<select id="editLoad"></select></label>
      <label class="for-load">Punti di contatto<select id="editContact"></select></label>
      <label class="for-phase">Fase<select id="editPhase"></select></label>
      <label class="for-target">Target<select id="editTarget"></select></label>
      <label class="for-location">Location<select id="editLocationSelect"></select><input id="editLocationText" maxlength="80" hidden></label>
      <fieldset id="editParents" class="for-parent edit-wide"><legend>Label genitore</legend><div id="parentChoices"></div></fieldset>
      <label class="edit-wide">Nota<textarea id="editNote" rows="2" maxlength="5000"></textarea></label>
    </div>
    <div class="dialog-actions"><button type="submit">Applica</button><button id="deleteLabel" type="button">Elimina</button><button id="cancelEdit" type="button">Chiudi</button></div>
  </form>
</dialog>
<dialog id="chooseDialog" aria-label="Scegli annotazione"><h2 id="chooseTitle"></h2><div id="chooseList"></div><button id="closeChoose" type="button">Chiudi</button></dialog>
<script>
  const cameras = ['body', 'external', 'aria'];
  const videos = Object.fromEntries(cameras.map(camera => [camera, document.getElementById(camera + 'Video')]));
  const canvases = Object.fromEntries(cameras.map(camera => [camera, document.getElementById(camera + 'Canvas')]));
  const grid = document.getElementById('videos');
  const subject = document.getElementById('subject');
  const sequence = document.getElementById('sequence');
  const selectionSummary = document.getElementById('selectionSummary');
  const slider = document.getElementById('slider');
  const scrub = document.getElementById('scrub');
  const ruler = document.getElementById('ruler');
  const gridLines = document.getElementById('gridLines');
  const seekState = document.getElementById('seekState');
  const status = document.getElementById('status');
  const readout = document.getElementById('readout');
  const playButton = document.getElementById('play');
  const helpDialog = document.getElementById('helpDialog');
  const palette = document.getElementById('palette');
  const labelTooltip = document.getElementById('labelTooltip');
  const annotationRows = document.getElementById('annotationRows');
  const endButton = document.getElementById('endLabel');
  const saveButton = document.getElementById('saveLabels');
  const editDialog = document.getElementById('editDialog');
  const chooseDialog = document.getElementById('chooseDialog');
  const controls = [slider, playButton, document.getElementById('previous'), document.getElementById('next')];
  let catalog = {};
  let frames = 0;
  let playing = false;
  let loading = 0;
  let playVersion = 0;
  let pendingFrame = 0;
  let seekScheduled = 0;
  let seekTimeout = 0;
  let finishSeek = null;
  let seekDone = Promise.resolve(true);
  const displayed = Object.fromEntries(cameras.map(camera => [camera, null]));
  const held = new Set();
  let labelSchema = null;
  let labelProblem = '';
  let annotations = [];
  let revision = null;
  let dirty = false;
  let editVersion = 0;
  let saving = false;
  let pendingId = null;
  let editingId = null;
  let activeSubject = '';
  let activeSequence = '';
  let draggingHandle = null;

  function labelUrl() {
    return `/api/labels?subject=${encodeURIComponent(subject.value)}&sequence=${encodeURIComponent(sequence.value)}`;
  }

  async function getJson(url) {
    const response = await fetch(url);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    return data;
  }

  function markDirty() {
    dirty = true;
    editVersion++;
    saveButton.disabled = saving || !frames || pendingId !== null || !labelSchema?.task || !!labelProblem;
  }

  function syncTimes(record) {
    record.t_start = (record.start_frame - 1) / 30;
    record.t_end = record.level === 'aux' && record.label === 'sync'
      ? record.t_start : record.end_frame / 30;
  }

  function recordSummary(record) {
    const attributes = ['phase', 'rep', 'side', 'direction', 'external_load', 'contact_points', 'target', 'location', 'note']
      .filter(name => record[name] !== null && record[name] !== '')
      .map(name => `${name}: ${name === 'note' ? record[name].slice(0, 80) : record[name]}`);
    if (record.level === 'high') attributes.unshift(...Object.entries(labelSchema?.task_attributes || {})
      .filter(([name, value]) => ['variant', 'kg', 'load_class'].includes(name) && value !== null)
      .map(([name, value]) => `${name}: ${value}`));
    const duration = record.level === 'aux' && record.label === 'sync'
      ? `frame ${record.start_frame}`
      : `frame ${record.start_frame}–${record.end_frame} · ${record.end_frame - record.start_frame + 1} frame`;
    return `${record.level} · ${record.label} · ${duration}${attributes.length ? ' · ' + attributes.join(' · ') : ''}`
      + (record.id === pendingId ? ' · in attesa di End' : '');
  }

  function placeBar(bar, record) {
    const span = Math.max(1, frames - 1);
    const minimum = bar.classList.contains('point') ? 12 : 20;
    bar.style.left = `min(${(record.start_frame - 1) / span * 100}%, calc(100% - ${minimum}px))`;
    bar.style.width = `${(record.end_frame - record.start_frame) / span * 100}%`;
  }

  function renderAnnotations() {
    annotationRows.replaceChildren();
    const groups = new Map();
    for (const record of annotations) {
      const key = `${record.level}:${record.label}`;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(record);
    }
    for (const records of groups.values()) {
      const row = document.createElement('div');
      row.className = 'annotation-row';
      row.setAttribute('aria-label', `Traccia ${records[0].level} ${records[0].label}`);
      const name = document.createElement('button');
      name.className = 'track-name';
      name.type = 'button';
      name.textContent = `${records[0].level} · ${records[0].label}`;
      name.title = `Modifica ${name.textContent}`;
      name.disabled = records.every(record => record.id === pendingId);
      name.addEventListener('click', () => openTrack(records));
      const track = document.createElement('div');
      track.className = 'annotation-track';
      track.addEventListener('pointerdown', event => {
        if (event.target !== track || !frames) return;
        const box = track.getBoundingClientRect();
        seek(Math.round((event.clientX - box.left) / box.width * (frames - 1)));
      });
      const laneEnds = [];
      const pixelsPerFrame = ruler.clientWidth / Math.max(1, frames - 1);
      for (const record of records.sort((a, b) => a.start_frame - b.start_frame || a.id - b.id)) {
        const startPixel = (record.start_frame - 1) * pixelsPerFrame;
        const endPixel = Math.max((record.end_frame - 1) * pixelsPerFrame,
          startPixel + (record.level === 'aux' && record.label === 'sync' ? 12 : 20));
        let lane = laneEnds.findIndex(end => end + 3 < startPixel);
        if (lane < 0) lane = laneEnds.length;
        laneEnds[lane] = endPixel;
        const bar = document.createElement('div');
        bar.className = `annotation-bar${record.id === pendingId ? ' pending' : ''}`;
        bar.dataset.level = record.level;
        bar.dataset.recordId = record.id;
        bar.style.top = `${lane * 28 + 3}px`;
        if (record.level === 'aux' && record.label === 'sync') bar.classList.add('point');
        placeBar(bar, record);
        const caption = document.createElement('button');
        caption.className = 'annotation-caption';
        caption.type = 'button';
        caption.textContent = recordSummary(record);
        caption.title = recordSummary(record);
        caption.disabled = record.id === pendingId;
        caption.addEventListener('click', () => openEditor(record.id));
        bar.append(caption);
        for (const edge of (bar.classList.contains('point') ? ['start'] : ['start', 'end'])) {
          const handle = document.createElement('div');
          handle.className = `annotation-handle ${edge}`;
          handle.role = 'slider';
          handle.tabIndex = record.id === pendingId ? -1 : 0;
          handle.setAttribute('aria-label', `${edge === 'start' ? 'Inizio' : 'Fine'} ${record.label}`);
          handle.setAttribute('aria-valuemin', '1');
          handle.setAttribute('aria-valuemax', String(frames));
          handle.setAttribute('aria-valuenow', String(record[edge === 'start' ? 'start_frame' : 'end_frame']));
          handle.addEventListener('pointerdown', event => {
            if (record.id === pendingId) return;
            event.preventDefault();
            event.stopPropagation();
            draggingHandle = {record, edge, track, bar, caption};
            handle.setPointerCapture(event.pointerId);
            seek(record[edge === 'start' ? 'start_frame' : 'end_frame'] - 1);
          });
          handle.addEventListener('pointermove', event => {
            if (!draggingHandle || draggingHandle.record !== record || !handle.hasPointerCapture(event.pointerId)) return;
            const box = track.getBoundingClientRect();
            const frame = Math.max(1, Math.min(frames, Math.round((event.clientX - box.left) / box.width * (frames - 1)) + 1));
            adjustEdge(record, edge, frame);
            placeBar(bar, record);
            caption.textContent = recordSummary(record);
            caption.title = caption.textContent;
            handle.setAttribute('aria-valuenow', String(record[edge === 'start' ? 'start_frame' : 'end_frame']));
          });
          handle.addEventListener('pointerup', () => { draggingHandle = null; renderAnnotations(); });
          handle.addEventListener('pointercancel', () => { draggingHandle = null; renderAnnotations(); });
          handle.addEventListener('keydown', event => {
            if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
            event.preventDefault();
            event.stopPropagation();
            adjustEdge(record, edge, record[edge === 'start' ? 'start_frame' : 'end_frame']
              + (event.key === 'ArrowRight' ? 1 : -1));
            renderAnnotations();
            annotationRows.querySelector(`[data-record-id="${record.id}"] .annotation-handle.${edge}`).focus();
          });
          bar.append(handle);
        }
        track.append(bar);
      }
      track.style.height = `${Math.max(1, laneEnds.length) * 28 + 3}px`;
      row.append(name, track);
      annotationRows.append(row);
    }
  }

  function adjustEdge(record, edge, frame) {
    if (record.level === 'aux' && record.label === 'sync') {
      record.start_frame = record.end_frame = Math.max(1, Math.min(frames, frame));
    } else if (edge === 'start') {
      record.start_frame = Math.max(1, Math.min(record.end_frame, frame));
    } else {
      record.end_frame = Math.max(record.start_frame, Math.min(frames, frame));
    }
    syncTimes(record);
    markDirty();
    const edgeFrame = record[edge === 'start' ? 'start_frame' : 'end_frame'] - 1;
    if (pendingFrame !== edgeFrame || playing) seek(edgeFrame);
  }

  function renderPalette() {
    labelTooltip.hidden = true;
    palette.replaceChildren();
    if (labelProblem) { palette.textContent = labelProblem; return; }
    if (!labelSchema?.task) {
      palette.textContent = 'Nessuna label definita nello schema per questa sequenza.';
      return;
    }
    for (const [level, title] of [['high', 'High'], ['mid', 'Mid'], ['low', 'Low'], ['atomic', 'Atomic'], ['aux', 'Aux']]) {
      const group = document.createElement('div');
      group.className = 'palette-group';
      const heading = document.createElement('strong');
      heading.textContent = title;
      group.append(heading);
      for (const choice of labelSchema.choices.filter(item => item.level === level)) {
        const chip = document.createElement('button');
        chip.className = 'label-chip';
        chip.type = 'button';
        chip.textContent = choice.phase ? `${choice.label} · ${choice.phase}` : choice.label;
        chip.dataset.definition = choice.definition || 'Definizione non presente nello schema.';
        chip.setAttribute('aria-description', chip.dataset.definition);
        chip.addEventListener('mouseenter', event => showLabelTooltip(chip, event.clientX, event.clientY));
        chip.addEventListener('mousemove', event => placeLabelTooltip(event.clientX, event.clientY));
        chip.addEventListener('mouseleave', () => { labelTooltip.hidden = true; });
        chip.addEventListener('focus', () => {
          const box = chip.getBoundingClientRect();
          showLabelTooltip(chip, box.left, box.bottom);
        });
        chip.addEventListener('blur', () => { labelTooltip.hidden = true; });
        chip.addEventListener('click', () => addChoice(choice));
        group.append(chip);
      }
      if (group.children.length > 1) palette.append(group);
    }
  }

  function placeLabelTooltip(x, y) {
    labelTooltip.style.left = `${Math.max(8, Math.min(x + 12, innerWidth - labelTooltip.offsetWidth - 8))}px`;
    labelTooltip.style.top = `${Math.max(8, Math.min(y + 12, innerHeight - labelTooltip.offsetHeight - 8))}px`;
  }

  function showLabelTooltip(chip, x, y) {
    labelTooltip.textContent = chip.dataset.definition;
    labelTooltip.hidden = false;
    placeLabelTooltip(x, y);
  }

  function newRecord(choice, frame) {
    const {level, label, phase} = choice;
    const record = {id: Math.max(0, ...annotations.map(item => item.id)) + 1, level, label, phase,
      start_frame: frame, end_frame: frame, t_start: 0, t_end: 0, parents: [], rep: null,
      side: null, direction: null, external_load: null, contact_points: null,
      target: level === 'high' ? labelSchema.task_attributes.target ?? null : null,
      location: level === 'low' && choice.location_values?.length === 1 ? choice.location_values[0] : null,
      note: null};
    syncTimes(record);
    annotations.push(record);
    if (!(level === 'aux' && label === 'sync')) pendingId = record.id;
    markDirty();
    renderAnnotations();
    endButton.disabled = pendingId === null;
    return record;
  }

  async function addChoice(choice) {
    if (labelProblem || !frames || !labelSchema?.choices.some(item => item.level === choice.level && item.label === choice.label
        && item.phase === choice.phase)) return;
    if (pendingId !== null) { message('Chiudi prima l’intervallo corrente con End.', 'warn'); return; }
    if (!await exactFrame()) { message('Attendi che le tre camere mostrino lo stesso frame.', 'error'); return; }
    const record = newRecord(choice, pendingFrame + 1);
    message(record.id === pendingId
      ? `${record.label}: inizio al frame ${record.start_frame}. Vai al frame finale e premi End.`
      : `${record.label}: evento al frame ${record.start_frame}.`);
  }

  async function exactFrame() {
    if (playing) return await seek(Math.min(frames - 1, Math.floor(videos.body.currentTime * 30)));
    return await seekDone;
  }

  function fillSelect(select, values, current) {
    select.replaceChildren(new Option('—', ''), ...values.map(value => new Option(value, value)));
    select.value = current ?? '';
  }

  function openTrack(records) {
    const editable = records.filter(record => record.id !== pendingId);
    if (editable.length === 1) { openEditor(editable[0].id); return; }
    if (!editable.length) return;
    document.getElementById('chooseTitle').textContent = `${editable[0].level} · ${editable[0].label}`;
    document.getElementById('chooseList').replaceChildren(...editable.map(record => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = `#${record.id} · ${recordSummary(record)}`;
      button.addEventListener('click', () => { chooseDialog.close(); openEditor(record.id); });
      return button;
    }));
    chooseDialog.showModal();
  }

  function openEditor(id) {
    const record = annotations.find(item => item.id === id);
    if (!record || id === pendingId) return;
    editingId = id;
    document.getElementById('editTitle').textContent = `${record.level} · ${record.label}`;
    document.getElementById('editStart').value = record.start_frame;
    document.getElementById('editEnd').value = record.end_frame;
    document.getElementById('editEnd').disabled = record.level === 'aux' && record.label === 'sync';
    document.getElementById('editStart').max = frames;
    document.getElementById('editEnd').max = frames;
    document.getElementById('editRep').value = record.rep ?? '';
    document.getElementById('editNote').value = record.note ?? '';
    for (const [field, id] of [['side', 'editSide'], ['direction', 'editDirection'],
                               ['external_load', 'editLoad'], ['contact_points', 'editContact']])
      fillSelect(document.getElementById(id),
        field === 'side' ? labelSchema.side_values : field === 'direction' ? labelSchema.direction_values
        : labelSchema.attribute_values[field].values, record[field]);
    fillSelect(document.getElementById('editTarget'),
      labelSchema.attribute_values.target.values.map(item => item.value), record.target);
    document.getElementById('editTarget').disabled = record.level === 'high' && !!labelSchema.task_attributes.target;
    document.querySelectorAll('.for-mid').forEach(item => item.hidden = record.level !== 'mid');
    document.querySelectorAll('.for-target').forEach(item => item.hidden = record.level === 'aux'
      || record.level === 'high' && !labelSchema.task_attributes.target);
    document.querySelectorAll('.for-load').forEach(item => item.hidden = record.level !== labelSchema.load_contact_level);
    const choice = labelSchema.choices.find(item => item.level === record.level && item.label === record.label
      && item.phase === record.phase);
    const locations = choice?.location_values || [];
    const pattern = choice?.location_pattern;
    document.querySelectorAll('.for-location').forEach(item => item.hidden = record.level !== 'low'
      || (!locations.length && !pattern));
    fillSelect(document.getElementById('editLocationSelect'), locations, record.location);
    document.getElementById('editLocationSelect').hidden = !!pattern;
    const locationText = document.getElementById('editLocationText');
    locationText.hidden = !pattern;
    locationText.value = record.location ?? '';
    locationText.pattern = pattern ? pattern.replace('<n>', '[1-9][0-9]*') : '';
    locationText.placeholder = pattern ? pattern.replace('<n>', '1') : '';
    const phases = [...new Set(labelSchema.choices.filter(item => item.level === record.level
      && item.label === record.label && item.phase).map(item => item.phase))];
    document.querySelectorAll('.for-phase').forEach(item => item.hidden = !phases.length);
    const phaseSelect = document.getElementById('editPhase');
    fillSelect(phaseSelect, phases, record.phase);
    phaseSelect.required = phases.length > 0 && !labelSchema.choices.some(item => item.level === record.level
      && item.label === record.label && item.phase === null);
    document.querySelectorAll('.for-side').forEach(item => item.hidden = !['mid', 'low', 'atomic'].includes(record.level)
      || !labelSchema.side_values.length);
    document.querySelectorAll('.for-direction').forEach(item => item.hidden = !['mid', 'low', 'atomic'].includes(record.level)
      || !labelSchema.direction_values.length);
    document.querySelectorAll('.for-parent').forEach(item => item.hidden = !['mid', 'low', 'atomic'].includes(record.level));
    const levels = ['high', 'mid', 'low', 'atomic'];
    const parentLevel = levels.slice(0, levels.indexOf(record.level)).reverse()
      .find(level => annotations.some(item => item.level === level));
    const parentChoices = document.getElementById('parentChoices');
    const candidates = annotations.filter(item => item.level === parentLevel)
      .sort((a, b) => a.start_frame - b.start_frame || a.id - b.id);
    parentChoices.replaceChildren(...candidates.map(item => {
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.value = item.id;
      checkbox.checked = record.parents.includes(item.id);
      label.append(checkbox, `#${item.id} ${item.label} · frame ${item.start_frame}–${item.end_frame}`);
      return label;
    }));
    if (!candidates.length) parentChoices.textContent = `Nessuna label ${parentLevel} disponibile.`;
    editDialog.showModal();
  }

  function message(text, kind = '') {
    status.textContent = text;
    status.className = kind;
  }

  function updateReadout(frame) {
    readout.textContent = frames ? `${playing ? '≈ ' : ''}Frame ${frame + 1} / ${frames}` : 'Frame —';
    slider.setAttribute('aria-valuetext', frames ? `${playing ? 'Circa frame' : 'Frame'} ${frame + 1} di ${frames}` : 'Nessun frame');
    scrub.style.setProperty('--progress', `${frames > 1 ? frame / (frames - 1) * 100 : 0}%`);
  }

  function updateRuler() {
    ruler.replaceChildren(document.getElementById('playheadHead'));
    gridLines.replaceChildren();
    for (let frame = 0; frame < frames; frame += 10) {
      const major = frame % 50 === 0;
      const tick = document.createElement('div');
      tick.className = `tick${major ? ' major' : ''}`;
      tick.style.left = `${frames > 1 ? frame / (frames - 1) * 100 : 0}%`;
      if (major) {
        const label = document.createElement('span');
        label.textContent = frame + 1;
        tick.append(label);
      }
      ruler.append(tick);
      const line = document.createElement('div');
      line.className = `grid-line${major ? ' major' : ''}`;
      line.style.left = tick.style.left;
      gridLines.append(line);
    }
  }

  function stopPlayback() {
    playVersion++;
    playing = false;
    held.clear();
    cameras.forEach(camera => {
      videos[camera].pause();
      videos[camera].playbackRate = 1;
    });
    playButton.querySelector('.nav-icon').textContent = '▶';
    playButton.querySelector('.button-label').textContent = 'Riproduci';
  }

  function cancelSeek() {
    if (seekScheduled) cancelAnimationFrame(seekScheduled);
    clearTimeout(seekTimeout);
    seekScheduled = 0;
    if (finishSeek) finishSeek(false);
    finishSeek = null;
    seekDone = Promise.resolve(false);
  }

  function maybeCommit() {
    if (!finishSeek || seekScheduled || !frames || playing) return;
    const instant = pendingFrame / 30 + 0.001;
    if (!cameras.every(camera => {
      const video = videos[camera];
      return !video.seeking && video.readyState >= 2 && Math.abs(video.currentTime - instant) < 0.001
        && displayed[camera] !== null && Math.round(displayed[camera] * 30) === pendingFrame;
    })) return;
    // A single browser paint shows the three decoded frames together.
    cameras.forEach(camera => {
      const video = videos[camera];
      const canvas = canvases[camera];
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
    });
    seekState.textContent = '';
    clearTimeout(seekTimeout);
    grid.classList.remove('seeking');
    const resolve = finishSeek;
    finishSeek = null;
    resolve(true);
  }

  function seek(frame) {
    if (!frames) return Promise.resolve(false);
    stopPlayback();
    if (status.textContent.startsWith('Il browser non ha confermato')) message('');
    frame = Math.max(0, Math.min(frames - 1, Number(frame)));
    pendingFrame = frame;
    cameras.forEach(camera => {
      if (displayed[camera] === null || Math.round(displayed[camera] * 30) !== frame)
        displayed[camera] = null;
    });
    slider.value = frame;
    updateReadout(frame);
    if (!grid.classList.contains('frozen')) cameras.forEach(camera => {
      const canvas = canvases[camera];
      canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    });
    grid.classList.add('frozen', 'seeking');
    seekState.textContent = 'Aggiornamento dei tre frame…';
    cancelSeek();
    seekDone = new Promise(resolve => { finishSeek = resolve; });
    seekTimeout = setTimeout(() => {
      if (!finishSeek) return;
      cancelSeek();
      seekState.textContent = 'Frame non verificato';
      message('Il browser non ha confermato lo stesso frame sulle tre camere. Riprova a spostare la testina.', 'error');
    }, 10000);
    seekScheduled = requestAnimationFrame(() => {
      seekScheduled = 0;
      const instant = pendingFrame / 30 + 0.001;
      cameras.forEach(camera => {
        const video = videos[camera];
        if (Math.abs(video.currentTime - instant) >= 0.001 || video.readyState < 2
            || displayed[camera] === null)
          video.currentTime = instant;
      });
      maybeCommit();
    });
    return seekDone;
  }

  async function togglePlay() {
    if (!frames) return;
    if (playing) { seek(Math.floor(videos.body.currentTime * 30)); return; }
    if (Number(slider.value) >= frames - 1) seek(0);
    const request = ++playVersion;
    const ready = await seekDone;
    if (!ready || request !== playVersion || !frames) return;
    playing = true;
    playButton.querySelector('.nav-icon').textContent = '⏸';
    playButton.querySelector('.button-label').textContent = 'Pausa';
    seekState.textContent = 'Preparazione delle tre camere…';
    try {
      await Promise.all(cameras.map(async camera => {
        const video = videos[camera];
        const start = video.currentTime;
        await video.play();
        await new Promise((resolve, reject) => {
          const deadline = performance.now() + 10000;
          function waitForFrame() {
            if (request !== playVersion) resolve();
            else if (video.currentTime >= start + 1 / 30) { video.pause(); resolve(); }
            else if (performance.now() > deadline) reject(new Error(`La camera ${camera} non avanza.`));
            else requestAnimationFrame(waitForFrame);
          }
          waitForFrame();
        });
      }));
      if (request !== playVersion) return;
      await Promise.all(cameras.map(camera => videos[camera].play()));
      if (request !== playVersion) return;
      seekState.textContent = '';
      grid.classList.remove('frozen');
      requestAnimationFrame(tick);
    } catch (error) {
      if (request !== playVersion) return;
      stopPlayback();
      seekState.textContent = '';
      message(`Riproduzione non riuscita: ${error.message}`, 'error');
    }
  }

  function tick() {
    if (!playing) return;
    const master = videos.body.currentTime;
    if (master >= (frames - 0.5) / 30) { seek(frames - 1); return; }
    const shown = Object.fromEntries(cameras.map(camera =>
      [camera, displayed[camera] ?? videos[camera].currentTime]));
    const slowest = Math.min(...Object.values(shown));
    for (const camera of cameras) {
      const video = videos[camera];
      const ahead = shown[camera] - slowest;
      if (ahead > 2 / 30 && !video.paused) { video.pause(); held.add(camera); }
      else if (held.has(camera) && ahead < 1 / 30) {
        held.delete(camera);
        video.play().catch(error => {
          if (playing) { stopPlayback(); message(`Riproduzione non riuscita: ${error.message}`, 'error'); }
        });
      }
    }
    for (const camera of cameras.slice(1)) {
      const video = videos[camera];
      const rate = Math.max(0.95, Math.min(1.05, 1 + (shown.body - shown[camera]) * 2));
      if (Math.abs(video.playbackRate - rate) > 0.005) video.playbackRate = rate;
    }
    const frame = Math.min(frames - 1, Math.floor(master * 30));
    slider.value = frame;
    updateReadout(frame);
    requestAnimationFrame(tick);
  }

  function populate(select, values) {
    select.replaceChildren(...values.map(value => new Option(value, value)));
    select.disabled = !values.length;
  }

  async function loadSequence() {
    const turn = ++loading;
    activeSubject = subject.value;
    activeSequence = sequence.value;
    selectionSummary.textContent = `Soggetto ${activeSubject} · Sequenza ${activeSequence}`;
    stopPlayback();
    cancelSeek();
    frames = 0;
    labelSchema = null;
    labelProblem = '';
    annotations = [];
    revision = null;
    dirty = false;
    saving = false;
    pendingId = null;
    endButton.disabled = true;
    saveButton.disabled = true;
    palette.textContent = '';
    renderAnnotations();
    grid.classList.add('frozen');
    grid.classList.remove('seeking');
    seekState.textContent = '';
    cameras.forEach(camera => {
      displayed[camera] = null;
      const canvas = canvases[camera];
      canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    });
    controls.forEach(control => control.disabled = true);
    updateReadout(0);
    message('Preparazione dei video… La prima apertura può richiedere alcuni secondi.');
    try {
      const query = `subject=${encodeURIComponent(subject.value)}&sequence=${encodeURIComponent(sequence.value)}`;
      const [data, schema, labelResponse] = await Promise.all([
        getJson(`/api/sequence?${query}`), getJson(`/api/schema?${query}`), fetch(`/api/labels?${query}`)]);
      const saved = await labelResponse.json();
      if (!labelResponse.ok && labelResponse.status !== 409)
        throw new Error(saved.error || `HTTP ${labelResponse.status}`);
      if (turn !== loading) return;
      const metadata = cameras.map(camera => data.metadata[camera]);
      if (metadata.some(item => item.codec !== 'h264' || Math.abs(item.fps - 30) > 0.01 || item.frames < 1))
        throw new Error('Questa sequenza non contiene tre video H.264 a 30 fps con conteggio frame valido.');
      if (cameras.some(camera => !videos[camera].requestVideoFrameCallback))
        throw new Error('Questo browser non permette di verificare il frame mostrato. Usa una versione aggiornata di Chrome, Edge o Firefox.');
      frames = Math.min(...metadata.map(item => item.frames));
      labelSchema = schema;
      labelProblem = labelResponse.ok ? '' : saved.error;
      annotations = labelResponse.ok ? saved.data.annotations : [];
      revision = labelResponse.ok ? saved.revision : null;
      renderPalette();
      renderAnnotations();
      await Promise.all(cameras.map(camera => new Promise((resolve, reject) => {
        const video = videos[camera];
        video.onloadedmetadata = resolve;
        video.onerror = () => reject(new Error(`Il browser non riesce a caricare la camera ${camera}.`));
        video.src = data.videos[camera];
        video.load();
      })));
      if (turn !== loading) return;
      slider.max = frames - 1;
      updateRuler();
      controls.forEach(control => control.disabled = false);
      seek(0);
      const counts = metadata.map(item => item.frames);
      const warnings = saved.warnings || [];
      const lengthWarning = new Set(counts).size > 1
        ? `Lunghezze diverse: body ${counts[0]}, esterna ${counts[1]}, Aria ${counts[2]} frame. La timeline si ferma al più corto.` : '';
      message(labelProblem || [lengthWarning, ...warnings].filter(Boolean).join(' · '),
        labelProblem || lengthWarning || warnings.length ? 'warn' : '');
    } catch (error) {
      if (turn === loading) {
        frames = 0;
        controls.forEach(control => control.disabled = true);
        message(error.message, 'error');
      }
    }
  }

  async function saveLabels() {
    if (!dirty || saving || pendingId !== null || !frames || !labelSchema?.task || labelProblem) return;
    saving = true;
    saveButton.disabled = true;
    const turn = loading;
    const version = editVersion;
    const document = {schema_version: labelSchema.schema_version, subject: subject.value,
      sequence: sequence.value, fps: 30, annotations};
    try {
      const response = await fetch(labelUrl(), {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({revision, data: document})});
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
      if (turn !== loading) return;
      revision = result.revision;
      saving = false;
      dirty = editVersion !== version;
      saveButton.disabled = !dirty || pendingId !== null;
      const confirmation = dirty ? 'Salvataggio completato; ci sono nuove modifiche da salvare.'
        : `Annotazioni salvate in ${subject.value}/label/${sequence.value}.json`;
      message([confirmation, ...(result.warnings || [])].join(' · '), result.warnings?.length ? 'warn' : '');
    } catch (error) {
      if (turn !== loading) return;
      saving = false;
      message(error.message, 'error');
      saveButton.disabled = pendingId !== null;
    }
  }

  async function closeInterval() {
    if (pendingId === null) return;
    if (!await exactFrame()) { message('Attendi che le tre camere mostrino lo stesso frame.', 'error'); return; }
    const record = annotations.find(item => item.id === pendingId);
    const end = Number(slider.value) + 1;
    if (end < record.start_frame) {
      message(`Il frame finale deve essere almeno ${record.start_frame}.`, 'error');
      return;
    }
    record.end_frame = end;
    syncTimes(record);
    pendingId = null;
    endButton.disabled = true;
    markDirty();
    renderAnnotations();
    message(`Intervallo ${record.label}: frame ${record.start_frame}–${end}.`);
  }

  function updateVisibility() {
    let count = 0;
    document.querySelectorAll('.visibility input').forEach(input => {
      const visible = input.checked;
      document.querySelector(`.camera[data-camera="${input.dataset.camera}"]`).hidden = !visible;
      if (visible) count++;
    });
    grid.classList.toggle('one', count === 1);
    grid.classList.toggle('two', count === 2);
  }

  function confirmSequenceChange() {
    if (!dirty || window.confirm('Ci sono annotazioni non salvate. Vuoi cambiare sequenza e perderle?')) return true;
    subject.value = activeSubject;
    populate(sequence, catalog[activeSubject]);
    sequence.value = activeSequence;
    return false;
  }

  subject.addEventListener('change', () => {
    if (!confirmSequenceChange()) return;
    populate(sequence, catalog[subject.value]);
    loadSequence();
  });
  sequence.addEventListener('change', () => { if (confirmSequenceChange()) loadSequence(); });
  window.addEventListener('beforeunload', event => { if (dirty) { event.preventDefault(); event.returnValue = ''; } });
  window.addEventListener('resize', renderAnnotations);
  document.getElementById('previous').addEventListener('click', () => seek(Number(slider.value) - 1));
  document.getElementById('next').addEventListener('click', () => seek(Number(slider.value) + 1));
  endButton.addEventListener('click', closeInterval);
  saveButton.addEventListener('click', saveLabels);
  document.getElementById('cancelEdit').addEventListener('click', () => editDialog.close());
  document.getElementById('closeChoose').addEventListener('click', () => chooseDialog.close());
  document.getElementById('deleteLabel').addEventListener('click', () => {
    annotations = annotations.filter(item => item.id !== editingId);
    annotations.forEach(item => { item.parents = item.parents.filter(id => id !== editingId); });
    editingId = null;
    editDialog.close();
    markDirty();
    renderAnnotations();
  });
  document.getElementById('editForm').addEventListener('submit', event => {
    event.preventDefault();
    const record = annotations.find(item => item.id === editingId);
    if (!record) return;
    const start = Number(document.getElementById('editStart').value);
    const end = record.level === 'aux' && record.label === 'sync'
      ? start : Number(document.getElementById('editEnd').value);
    if (!Number.isInteger(start) || !Number.isInteger(end) || start < 1 || end > frames || start > end) {
      const input = document.getElementById('editEnd');
      input.setCustomValidity('Il frame finale deve essere compreso tra quello iniziale e l’ultimo frame del video.');
      input.reportValidity();
      input.setCustomValidity('');
      return;
    }
    record.start_frame = start;
    record.end_frame = end;
    record.rep = record.level === 'mid' && document.getElementById('editRep').value
      ? Number(document.getElementById('editRep').value) : null;
    record.side = ['mid', 'low', 'atomic'].includes(record.level) && labelSchema.side_values.length
      ? document.getElementById('editSide').value || null : null;
    record.direction = ['mid', 'low', 'atomic'].includes(record.level) && labelSchema.direction_values.length
      ? document.getElementById('editDirection').value || null : null;
    record.external_load = record.level === labelSchema.load_contact_level
      ? document.getElementById('editLoad').value || null : null;
    record.contact_points = record.level === labelSchema.load_contact_level
      ? document.getElementById('editContact').value || null : null;
    record.phase = document.querySelector('.for-phase').hidden ? null : document.getElementById('editPhase').value || null;
    record.target = record.level !== 'aux' ? document.getElementById('editTarget').value || null : null;
    record.location = record.level === 'low' ? (document.getElementById('editLocationText').hidden
      ? document.getElementById('editLocationSelect').value : document.getElementById('editLocationText').value.trim()) || null : null;
    record.note = document.getElementById('editNote').value || null;
    record.parents = ['mid', 'low', 'atomic'].includes(record.level)
      ? [...document.querySelectorAll('#parentChoices input:checked')].map(input => Number(input.value)) : [];
    syncTimes(record);
    editDialog.close();
    editingId = null;
    markDirty();
    renderAnnotations();
  });
  playButton.addEventListener('click', togglePlay);
  document.getElementById('help').addEventListener('click', () => {
    document.getElementById('helpDetails').textContent = frames
      ? `${frames} frame a 30 fps · tre camere pronte.` : 'Seleziona una sequenza per caricare le tre camere.';
    helpDialog.showModal();
  });
  document.getElementById('closeHelp').addEventListener('click', () => helpDialog.close());
  slider.addEventListener('input', () => seek(slider.value));
  cameras.forEach(camera => {
    const video = videos[camera];
    if (video.requestVideoFrameCallback) {
      function trackFrame(_, metadata) {
        displayed[camera] = metadata.mediaTime;
        maybeCommit();
        video.requestVideoFrameCallback(trackFrame);
      }
      video.requestVideoFrameCallback(trackFrame);
    }
    videos[camera].addEventListener('seeked', maybeCommit);
    videos[camera].addEventListener('loadeddata', maybeCommit);
    videos[camera].addEventListener('error', () => {
      if (!frames) return;
      stopPlayback();
      cancelSeek();
      seekState.textContent = '';
      message(`Errore nel video ${camera}. Ricarica la sequenza.`, 'error');
    });
  });
  document.querySelectorAll('.visibility input').forEach(input => input.addEventListener('change', updateVisibility));
  document.getElementById('labelsPanel').addEventListener('toggle', event => {
    if (!event.currentTarget.open) labelTooltip.hidden = true;
  });
  document.getElementById('resetViews').addEventListener('click', () => {
    document.querySelectorAll('.camera').forEach(camera => {
      camera.style.removeProperty('width');
      camera.style.removeProperty('height');
    });
  });
  document.addEventListener('keydown', event => {
    if (helpDialog.open || editDialog.open || chooseDialog.open || event.altKey || event.ctrlKey || event.metaKey
        || event.target.closest('input:not(#slider), textarea, select, .annotation-handle')) return;
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault();
      seek(Number(slider.value) + (event.key === 'ArrowRight' ? 1 : -1));
    } else if (event.code === 'Space' && event.target.tagName !== 'BUTTON' && event.target.tagName !== 'INPUT') {
      event.preventDefault();
      togglePlay();
    }
  });

  fetch('/api/catalog').then(response => response.json()).then(data => {
    catalog = data;
    populate(subject, Object.keys(catalog));
    if (!subject.value) { message('Nessuna sequenza RGB completa trovata. Verifica la cartella dei dati.', 'warn'); return; }
    populate(sequence, catalog[subject.value]);
    loadSequence();
  }).catch(error => message(`Catalogo non disponibile: ${error.message}`, 'error'));
</script>
</body>
</html>
